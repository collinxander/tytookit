<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="profilepic.jpg" type="image/x-icon">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>TY TO.OK IT</title>
  <style>
      body {
          margin: 0;
          padding: 0;
          overflow: hidden;
          font-family: 'Arial', sans-serif;
          background-color: #000;
          color: #fff;
          position: relative;
          width: 100vw;
          height: 100vh;
          opacity: 1;
      }

      .icon {
          display: none !important;
      }

      .icon:hover {
          color: lime;
      }

      @keyframes glow {
          0% { text-shadow: 0 0 5px red; }
          100% { text-shadow: 0 0 20px red; }
      }

      @keyframes fadeIn {
          from { opacity: 0; }
          to { opacity: 1; }
      }

      canvas {
          opacity: 1;
      }

      #heading {
          position: absolute;
          top: 20px;
          left: 0;
          width: 100%;
          text-align: center;
          z-index: 100;
          display: none;
      }

      h1 {
          font-size: 3rem;
          letter-spacing: 0.8rem;
          margin: 0;
          text-shadow: 0 0 10px rgba(0, 170, 255, 0.8);
          font-weight: 300;
      }

      .border {
          height: 2px;
          width: 300px;
          background: linear-gradient(90deg, transparent, #00aaff, transparent);
          margin: 10px auto;
          box-shadow: 0 0 10px rgba(0, 170, 255, 0.8);
      }

      #progress-container {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          text-align: center;
          z-index: 100;
          width: 400px;
          display: block;
          transition: opacity 0.5s ease-out;
          background: rgba(0, 0, 0, 0.8);
          padding: 40px;
          border-radius: 20px;
          border: 2px solid rgba(0, 170, 255, 0.3);
          box-shadow: 0 0 40px rgba(0, 170, 255, 0.4), inset 0 0 20px rgba(0, 170, 255, 0.1);
      }

      #progress-container.ready #progress-bar-container {
          display: none;
      }

      #progress-container.ready {
          background: transparent;
          border-color: transparent;
          box-shadow: none;
          width: auto;
          padding: 0;
      }

      #progress-container.ready #progress {
          display: none;
      }

      #progress-container.hidden {
          opacity: 0;
          pointer-events: none;
      }

      #progress {
          font-size: 1.65rem;
          letter-spacing: 0.2rem;
          margin-bottom: 30px;
          color: #c1a47d;
          text-shadow: 0 0 8px rgba(140, 108, 70, 0.75), 0 0 18px rgba(98, 74, 48, 0.45), 0 2px 0 rgba(30, 20, 10, 0.8);
          font-family: "Baskerville", "Garamond", "Palatino Linotype", serif;
          font-weight: 700;
          text-transform: uppercase;
          animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
          0%, 100% { 
              opacity: 0.8;
              text-shadow: 0 0 8px rgba(140, 108, 70, 0.7), 0 0 20px rgba(98, 74, 48, 0.45), 0 2px 0 rgba(30, 20, 10, 0.75);
          }
          50% { 
              opacity: 1;
              text-shadow: 0 0 14px rgba(175, 137, 92, 0.9), 0 0 28px rgba(125, 95, 62, 0.6), 0 2px 0 rgba(38, 24, 12, 0.85);
          }
      }

      #progress-bar-container {
          width: 100%;
          height: 8px;
          background: rgba(255, 255, 255, 0.05);
          border-radius: 20px;
          overflow: hidden;
          box-shadow: 0 0 15px rgba(0, 170, 255, 0.3), inset 0 0 10px rgba(0, 0, 0, 0.5);
          position: relative;
      }

      #progress-bar-container::before {
          content: '';
          position: absolute;
          top: 0;
          left: -100%;
          width: 100%;
          height: 100%;
          background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
          animation: shimmer 2s infinite;
      }

      @keyframes shimmer {
          0% { left: -100%; }
          100% { left: 100%; }
      }

      #progress-bar {
          height: 100%;
          width: 0%;
          background: linear-gradient(90deg, #0088ff, #00aaff, #00ffff, #00aaff, #0088ff);
          background-size: 200% 100%;
          transition: width 0.3s ease-out;
          box-shadow: 0 0 20px rgba(0, 170, 255, 1), 0 0 30px rgba(0, 255, 255, 0.8);
          border-radius: 20px;
          animation: gradientShift 3s ease infinite;
          position: relative;
      }

      @keyframes gradientShift {
          0%, 100% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
      }

      #progress-bar::after {
          content: '';
          position: absolute;
          top: 0;
          right: 0;
          width: 30px;
          height: 100%;
          background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5));
          filter: blur(5px);
      }

      #enter-gallery-button {
          display: none;
          width: fit-content;
          margin: 0 auto;
          padding: 12px 30px;
          border-radius: 2px;
          border: 1px solid rgba(255, 255, 255, 0.78);
          background: rgba(255, 255, 255, 0.025);
          -webkit-backdrop-filter: blur(1px);
          backdrop-filter: blur(1px);
          color: rgba(255, 255, 255, 0.95);
          text-decoration: none;
          text-transform: uppercase;
          box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 8px 20px rgba(0, 0, 0, 0.14);
          transform: perspective(600px) rotateX(6deg);
          transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease, border-color 0.16s ease;
          align-items: center;
          justify-content: center;
          gap: 0.12rem;
          position: relative;
          overflow: visible;
      }

      #enter-gallery-button::after {
          content: '';
          position: absolute;
          left: 10%;
          right: 10%;
          bottom: -10px;
          height: 8px;
          background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.22) 0%, rgba(0, 0, 0, 0) 72%);
          pointer-events: none;
          transition: opacity 0.16s ease, transform 0.16s ease;
      }

      #enter-gallery-button:hover {
          transform: perspective(600px) rotateX(5deg) translateY(-1px);
          background: rgba(255, 255, 255, 0.06);
          border-color: rgba(255, 255, 255, 0.95);
          box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14), 0 12px 24px rgba(0, 0, 0, 0.18);
      }

      #enter-gallery-button:hover::after {
          opacity: 0.3;
          transform: translateY(1px);
      }

      #enter-gallery-button:active {
          transform: perspective(600px) rotateX(4deg) translateY(1px);
          background: rgba(255, 255, 255, 0.045);
          box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12), 0 6px 14px rgba(0, 0, 0, 0.14);
      }

      #progress-container.ready #enter-gallery-button {
          display: inline-flex;
      }

      .enter-letter {
          font-size: 1.03rem;
          font-weight: 700;
          line-height: 1;
          display: inline-block;
          color: rgba(255, 255, 255, 0.95);
          text-shadow: none;
      }

      .font-one {
          font-family: "Helvetica Neue", Arial, sans-serif;
          letter-spacing: 0.08rem;
      }

      .font-two {
          font-family: "Times New Roman", Georgia, serif;
          font-weight: 700;
          letter-spacing: 0.02rem;
      }

      .font-three {
          font-family: "Courier New", "Lucida Console", monospace;
          font-weight: 700;
          letter-spacing: 0.01rem;
      }

      .credits {
          display: none !important;
      }

      .credits a {
          color: #00aaff;
          text-decoration: none;
      }

      .credits a:hover {
          text-decoration: underline;
      }

      .audio-controls {
          display: none !important;
      }

      #play-button {
          background: rgba(0, 170, 255, 0.2);
          border: 2px solid #00aaff;
          color: #ffffff;
          padding: 10px 20px;
          font-size: 1rem;
          border-radius: 30px;
          cursor: pointer;
          transition: all 0.3s;
          outline: none;
          box-shadow: 0 0 15px rgba(0, 170, 255, 0.5);
          display: none;
      }

      #play-button:hover {
          background: rgba(0, 170, 255, 0.4);
          box-shadow: 0 0 20px rgba(0, 170, 255, 0.8);
      }

      #visualizer-container {
          display: none !important;
      }

      #visualizer {
          width: 100%;
          height: 100%;
      }

      .instructions {
          display: none !important;
      }

      .instructions h3 {
          margin-top: 0;
          color: #00aaff;
      }

      .instructions p {
          margin-bottom: 5px;
      }

      #lyrics-container {
          display: none !important;
      }

      #current-lyric {
          font-size: 2rem;
          color: #fff;
          text-shadow: 0 0 10px rgba(0, 170, 255, 0.8);
          margin-bottom: 10px;
      }

      #next-lyric {
          font-size: 1.2rem;
          color: rgba(255, 255, 255, 0.7);
      }

      /* Fixed Media Queries */
      
      /* Large Desktop (1440px and up) */
      @media screen and (min-width: 1440px) {
          h1 {
              font-size: 3.5rem;
              letter-spacing: 1rem;
          }
          .border {
              width: 400px;
          }
          #visualizer-container {
              width: 400px;
              height: 80px;
          }
          .instructions {
              font-size: 1rem;
              max-width: 300px;
          }
          #current-lyric {
              font-size: 2.5rem;
          }
          #next-lyric {
              font-size: 1.5rem;
          }
          .icon {
              font-size: 32px;
              padding: 15px;
          }
      }

      /* Desktop (1024px - 1439px) */
      @media screen and (min-width: 1025px) and (max-width: 1439px) {
          h1 {
              font-size: 3.2rem;
              letter-spacing: 0.9rem;
          }
          .border {
              width: 350px;
          }
          #visualizer-container {
              width: 350px;
          }
          .instructions {
              max-width: 250px;
          }
          .icon {
              font-size: 30px;
              padding: 14px;
          }
      }

      /* Tablet (768px - 1024px) */
      @media screen and (min-width: 769px) and (max-width: 1024px) {
          .icon {
              font-size: 28px;
              padding: 12px;
          }
          h1 {
              font-size: 2.8rem;
              letter-spacing: 0.7rem;
          }
          .border {
              width: 300px;
          }
          #progress-container {
              width: 320px;
          }
          #play-button {
              padding: 12px 24px;
              font-size: 1.2rem;
          }
          .instructions {
              font-size: 0.9rem;
              max-width: 220px;
          }
          #visualizer-container {
              width: 300px;
              height: 60px;
          }
      }

      /* Large Mobile (481px - 768px) */
      @media screen and (min-width: 481px) and (max-width: 768px) {
          .icon {
              font-size: 26px;
              padding: 10px;
          }
          h1 {
              font-size: 2rem;
              letter-spacing: 0.5rem;
          }
          .border {
              width: 280px;
          }
          #progress {
              font-size: 1.1rem;
          }
          #progress-container {
              width: 300px;
          }
          #play-button {
              padding: 12px 24px;
              font-size: 1.1rem;
              min-width: 180px;
          }
          .audio-controls {
              bottom: 100px;
          }
          .instructions {
              font-size: 0.7rem;
              padding: 8px;
              max-width: 180px;
          }
          #visualizer-container {
              width: 280px;
              height: 60px;
          }
          .credits {
              font-size: 0.8rem;
          }
          #current-lyric {
              font-size: 1.8rem;
          }
          #next-lyric {
              font-size: 1rem;
          }
      }

      /* Medium Mobile (361px - 480px) */
      @media screen and (min-width: 361px) and (max-width: 480px) {
          .icon {
              font-size: 22px;
              padding: 8px;
              top: 10px;
              left: 10px;
          }
          h1 {
              font-size: 1.6rem;
              letter-spacing: 0.3rem;
          }
          .border {
              width: 220px;
          }
          #progress {
              font-size: 1rem;
          }
          #progress-container {
              width: 280px;
          }
          #play-button {
              padding: 10px 20px;
              font-size: 1rem;
              min-width: 160px;
          }
          .audio-controls {
              bottom: 140px;
          }
          .instructions {
              font-size: 0.65rem;
              padding: 6px;
              max-width: 140px;
              top: 10px;
              right: 10px;
          }
          .instructions h3 {
              font-size: 0.9rem;
              margin-bottom: 8px;
          }
          #visualizer-container {
              width: 240px;
              height: 50px;
          }
          .credits {
              font-size: 0.7rem;
              bottom: 10px;
              right: 10px;
          }
          #lyrics-container {
              bottom: 120px;
          }
          #current-lyric {
              font-size: 1.5rem;
          }
          #next-lyric {
              font-size: 0.9rem;
          }
      }

      /* Small Mobile (up to 360px) */
      @media screen and (max-width: 360px) {
          .icon {
              font-size: 20px;
              padding: 6px;
              top: 5px;
              left: 5px;
          }
          h1 {
              font-size: 1.4rem;
              letter-spacing: 0.2rem;
          }
          .border {
              width: 180px;
          }
          #progress-container {
              width: 250px;
          }
          #progress {
              font-size: 0.9rem;
          }
          #play-button {
              padding: 8px 16px;
              font-size: 0.9rem;
              min-width: 140px;
          }
          .audio-controls {
              bottom: 80px;
          }
          .instructions {
              font-size: 0.6rem;
              padding: 5px;
              max-width: 120px;
              top: 5px;
              right: 5px;
          }
          .instructions h3 {
              font-size: 0.8rem;
              margin-bottom: 6px;
          }
          #visualizer-container {
              width: 200px;
              height: 40px;
              bottom: 15px;
          }
          .credits {
              font-size: 0.6rem;
              bottom: 5px;
              right: 5px;
          }
          #lyrics-container {
              bottom: 100px;
          }
          #current-lyric {
              font-size: 1.3rem;
          }
          #next-lyric {
              font-size: 0.8rem;
          }
      }

      /* Landscape Orientation */
      @media screen and (max-height: 500px) and (orientation: landscape) {
          .icon {
              font-size: 20px;
              padding: 6px;
              top: 5px;
              left: 5px;
          }
          h1 {
              font-size: 1.8rem;
              letter-spacing: 0.4rem;
          }
          .border {
              width: 200px;
          }
          .instructions {
              max-width: 180px;
              font-size: 0.7rem;
              bottom: 70px;
              right: 10px;
              top: auto;
          }
          .instructions h3 {
              font-size: 0.9rem;
              margin-bottom: 5px;
          }
          .audio-controls {
              bottom: 40px;
          }
          #play-button {
              padding: 8px 16px;
              font-size: 0.9rem;
          }
          #visualizer-container {
              bottom: 10px;
              height: 30px;
              width: 250px;
          }
          .credits {
              bottom: 5px;
              font-size: 0.7rem;
          }
          #lyrics-container {
              bottom: 80px;
          }
          #current-lyric {
              font-size: 1.5rem;
          }
          #next-lyric {
              font-size: 0.9rem;
          }
          #progress-container {
              width: 250px;
          }
      }

      /* High-density displays (Retina) */
      @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
          .border {
              height: 3px;
          }
          #progress-bar-container {
              height: 5px;
          }
          #play-button {
              border-width: 3px;
          }
      }

      /* ==========================
         Enter Button — invisible-ish, 3D, breathing at rest,
         creative staggered letter-wave + shine sweep on hover.
         Keeps .plate / .glow / .label hooks so main.js still works.
         ========================== */
      .enter-wrap {
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          z-index: 220;
          pointer-events: none;
          opacity: 0;
          transition: opacity .6s ease;
          /* establishes the 3D viewing frustum for the button */
          perspective: 900px;
      }

      #enter-btn {
          --h: clamp(56px, 10vw, 92px);
          min-width: clamp(180px, 40vw, 300px);
          height: var(--h);
          padding: 0 clamp(28px, 6vw, 56px);
          background: transparent;
          border: none;
          cursor: pointer;
          display: grid;
          place-items: center;
          position: relative;
          transform-style: preserve-3d;
          transform: rotateX(8deg) translateZ(0);
          transition: transform .5s cubic-bezier(.2,.8,.2,1);
          -webkit-tap-highlight-color: transparent;
          outline: none;
          pointer-events: auto;
      }

      /* the glass plate — faint at rest, expands into view on hover */
      #enter-btn .plate {
          position: absolute;
          inset: 0;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.015);
          border: 1px solid rgba(255, 255, 255, 0.06);
          -webkit-backdrop-filter: blur(0px);
          backdrop-filter: blur(0px);
          box-shadow: 0 0 0 rgba(0, 0, 0, 0);
          transform: translateZ(-1px) scale(.9);
          overflow: hidden;
          transition: background .45s ease, border-color .45s ease,
                      box-shadow .45s ease, backdrop-filter .45s ease,
                      transform .5s cubic-bezier(.2,.8,.2,1);
          pointer-events: none;
          /* gentle breathing ring so the button is noticeable at rest */
          animation: enterBreathe 3.4s ease-in-out infinite;
      }

      /* light sweep that streaks across the plate on hover */
      #enter-btn .plate::before {
          content: '';
          position: absolute;
          top: 0;
          left: -60%;
          width: 45%;
          height: 100%;
          background: linear-gradient(100deg, transparent, rgba(255,255,255,0.28), transparent);
          transform: skewX(-18deg);
          opacity: 0;
          pointer-events: none;
      }

      @keyframes enterBreathe {
          0%, 100% {
              border-color: rgba(255, 255, 255, 0.05);
              box-shadow: 0 0 0 rgba(255,255,255,0);
          }
          50% {
              border-color: rgba(255, 255, 255, 0.13);
              box-shadow: 0 0 18px rgba(255,255,255,0.07);
          }
      }

      @keyframes enterSweep {
          0%   { left: -60%; opacity: 0; }
          15%  { opacity: 1; }
          85%  { opacity: 1; }
          100% { left: 130%; opacity: 0; }
      }

      /* floating contact shadow — sells the 3D lift */
      #enter-btn .glow {
          position: absolute;
          left: 12%;
          right: 12%;
          bottom: -14px;
          height: 14px;
          border-radius: 999px;
          background: radial-gradient(ellipse at center, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 72%);
          opacity: 0;
          transform: translateZ(-30px) scale(.9);
          transition: opacity .45s ease, transform .45s ease;
          pointer-events: none;
      }

      /* label — bolder, glowing, breathes softly at rest */
      #enter-btn .label {
          position: relative;
          z-index: 2;
          display: inline-flex;
          gap: 0.30em;
          font-family: 'Helvetica Neue', Arial, sans-serif;
          font-weight: 700;
          font-size: clamp(14px, 2.3vw, 18px);
          text-transform: uppercase;
          transform: translateZ(20px);
          transform-style: preserve-3d;
          transition: gap .5s cubic-bezier(.2,.8,.2,1);
          animation: labelBreathe 3.4s ease-in-out infinite;
      }

      @keyframes labelBreathe {
          0%, 100% { opacity: 0.72; }
          50%      { opacity: 1; }
      }

      /* each letter is its own 3D layer for the wave */
      #enter-btn .label span {
          display: inline-block;
          color: rgba(255, 255, 255, 0.9);
          text-shadow: 0 0 6px rgba(255, 255, 255, 0.22),
                       0 0 14px rgba(255, 255, 255, 0.1);
          transform: translateZ(0);
          transition: color .4s ease, text-shadow .4s ease;
      }

      /* creative staggered wave — each letter lifts + tips in sequence */
      @keyframes letterWave {
          0%, 100% { transform: translateY(0) translateZ(0) rotateX(0); }
          40%      { transform: translateY(-12px) translateZ(38px) rotateX(-22deg); }
      }

      /* ---------- HOVER: lots of movement ---------- */
      #enter-btn:hover {
          transform: rotateX(8deg) translateY(-8px) translateZ(28px);
      }

      /* stop the resting breathe and drive the continuous wave */
      #enter-btn:hover .label {
          animation: none;
          gap: 0.55em;
      }
      #enter-btn:hover .label span {
          color: #ffffff;
          text-shadow: 0 0 10px rgba(255,255,255,0.7),
                       0 0 22px rgba(255,255,255,0.4),
                       0 0 42px rgba(255,255,255,0.2);
          animation: letterWave 1.3s ease-in-out infinite;
          animation-delay: calc(var(--i) * 0.11s);
      }

      #enter-btn:hover .plate {
          transform: translateZ(-1px) scale(1);
          background: rgba(255, 255, 255, 0.05);
          border-color: rgba(255, 255, 255, 0.16);
          -webkit-backdrop-filter: blur(3px);
          backdrop-filter: blur(3px);
          box-shadow: inset 0 1px 0 rgba(255,255,255,0.2),
                      0 0 26px rgba(255,255,255,0.16),
                      0 20px 44px rgba(0,0,0,0.4);
          animation: none;
      }
      #enter-btn:hover .plate::before {
          animation: enterSweep 1.6s ease-in-out infinite;
      }
      #enter-btn:hover .glow {
          opacity: 1;
          transform: translateZ(-30px) scale(1);
      }

      /* active — press it back down into the surface */
      #enter-btn:active {
          transform: rotateX(8deg) translateY(-1px) translateZ(8px);
      }
      #enter-btn:active .glow {
          opacity: .6;
          transform: translateZ(-30px) scale(.92);
      }

      /* keyboard focus — quiet, accessible ring */
      #enter-btn:focus-visible .plate {
          border-color: rgba(255, 255, 255, 0.4);
          box-shadow: 0 0 0 3px rgba(255,255,255,0.12);
      }

      /* respect reduced-motion preferences */
      @media (prefers-reduced-motion: reduce) {
          #enter-btn .plate,
          #enter-btn .label,
          #enter-btn:hover .label span,
          #enter-btn:hover .plate::before {
              animation: none !important;
          }
      }

      /* fade transition overlay when entering the gallery */
      #open-transition {
          position: fixed;
          inset: 0;
          z-index: 500;
          background: #000;
          opacity: 0;
          pointer-events: none;
          transition: opacity 1.4s ease;
      }

      body.opening #open-transition {
          opacity: 1;
          pointer-events: auto;
      }

      body.opening #progress-container,
      body.opening .enter-wrap {
          transition: opacity 0.4s ease;
          opacity: 0;
          pointer-events: none;
      }
  </style>
</head>
<body>
  <div id="open-transition"></div>
  <div id="heading">
      <div class="border"></div>
  </div>

  <div id="visualizer-container">
      <canvas id="visualizer"></canvas>
  </div>

  <div id="lyrics-container">
      <div id="current-lyric"></div>
      <div id="next-lyric"></div>
  </div>
  <audio id="audio-player" loop crossOrigin="anonymous">
      Your browser does not support the audio element.
  </audio>
  <div class="credits">
      <div>3D Website Created & Developed by Collin Xander</div>
  </div>



  <script type="importmap">
  {
      "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
  }
  </script>
  <script type="module" src="./main.js"></script>
    <!-- Invisible-ish 3D Enter button with a creative letter-wave hover -->
    <div class="enter-wrap" aria-hidden="false">
        <button id="enter-btn" aria-label="Enter TY TO.OK IT" title="Enter TY TO.OK IT">
            <span class="plate" aria-hidden="true"></span>
            <span class="glow" aria-hidden="true"></span>
            <span class="label" aria-hidden="true">
                <span style="--i:0">E</span>
                <span style="--i:1">N</span>
                <span style="--i:2">T</span>
                <span style="--i:3">E</span>
                <span style="--i:4">R</span>
            </span>
        </button>
    </div>

    <script>
        (function(){
            const btn = document.getElementById('enter-btn');
            if(!btn) return;
            // Click handling for entering the gallery is wired up in main.js,
            // which reveals/controls the live Three.js scene rendered on this
            // same page (no page navigation needed).

            // show button only when canvas is ready (optional hook for main.js)
            window.showEnterButton = function(){
                const wrap = document.querySelector('.enter-wrap');
                if(wrap){ wrap.style.opacity = '1'; wrap.style.pointerEvents = 'auto'; }
            };
            // fallback: if main.js doesn't call the hook, reveal after a short delay for testing
            setTimeout(()=>{
                const wrap = document.querySelector('.enter-wrap');
                if(wrap && getComputedStyle(wrap).opacity === '0'){
                    wrap.style.opacity = '1'; wrap.style.pointerEvents = 'auto';
                }
            }, 800);
        })();
    </script>
</body>
</html>
